version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: together_backend
    environment:
      - PROJECT_NAME=Together
      - DATABASE_URL=sqlite+aiosqlite:///./together.db
      - JWT_SECRET=together_production_secret_key_change_me_2026
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
      - CORS_ORIGINS=["http://localhost", "http://localhost:5173", "http://localhost:80", "http://127.0.0.1"]
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/together.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: together_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
